name: Teach a card
description: A card whose rules text the simulator does not fully understand yet. The app fills this in for you.
title: "Teach: "
labels: ["unlearned"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Just press **Create** below: everything is already filled in by the app.
        A Claude session teaches the simulator these wordings (with a test for each), and the card plays correctly from the next version on.
  - type: textarea
    id: cards
    attributes:
      label: Cards and the lines the simulator does not understand yet
      description: Filled in by the app. One card per block.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Filled in by the app.
