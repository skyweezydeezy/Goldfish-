name: Launch check
# Proves the download-and-run path on a real Windows PC: download the zip, run start.bat, the app answers.
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Updater and server tests
        run: python tests/launch/test_launch.py
      - name: Download the zip, run start.bat, check the app
        shell: pwsh
        env:
          GOLDFISH_UPDATE_REF: ${{ env.SHA }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'app'
          Invoke-WebRequest "https://github.com/${{ github.repository }}/archive/$env:SHA.zip" -OutFile "$env:RUNNER_TEMP\app.zip"
          Expand-Archive "$env:RUNNER_TEMP\app.zip" $dir
          $root = (Get-ChildItem $dir -Directory)[0].FullName
          # make the download out of date, the way an old folder on a PC would be
          Remove-Item "$root\README.md"
          Set-Content "$root\goldfish\static\styles.css" 'stale'
          $p = Start-Process -FilePath "$root\start.bat" -ArgumentList '--no-browser', '--port', '8799' -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          try {
            $ok = $false
            foreach ($i in 1..90) {
              try { $r = Invoke-WebRequest 'http://127.0.0.1:8799/api/status' -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 1 }
            }
            Get-Content "$env:RUNNER_TEMP\out.txt", "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue
            if (-not $ok) { throw 'start.bat did not bring the app up' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8799/' -TimeoutSec 5
            if ($page.Content -notmatch '<script') { throw 'the app page is not being served' }
            if (-not (Test-Path "$root\README.md")) { throw 'the update did not restore a missing file' }
            if ((Get-Content "$root\goldfish\static\styles.css" -TotalCount 1) -eq 'stale') { throw 'the update did not replace an old file' }
            $have = (Get-Content "$root\.goldfish-install.json" -Raw | ConvertFrom-Json).sha
            if ($have -ne $env:SHA) { throw "installed version is $have, expected $env:SHA" }
            Write-Host "OK: start.bat updated to $have and the app is running"
          } finally {
            taskkill /T /F /PID $p.Id 2>$null | Out-Null
          }
