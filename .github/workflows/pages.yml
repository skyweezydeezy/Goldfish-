name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, iceymain, 'claude/visual-goldfish-calculator-1ztks5']          # only the default branch is published; other branches are refused by the Pages environment
  workflow_dispatch:
permissions:
  contents: write          # the deploy gives each merge a new version number and commits it
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Every push to the default branch (every merge) gets the next version number. It is committed back so downloads and
      # start.bat copies carry the same number as the site. A push made with the workflow's own token starts no new run.
      - name: New version number
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
            v=$(node tools/bump-version.js)
            git commit -q -am "Version $v"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then echo "number=$v" >> "$GITHUB_OUTPUT"; echo "Version $v" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 3
          done
          echo "could not push the new version number" >&2; exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: goldfish/static
      # GitHub's artifact service sometimes does not list the artifact just uploaded ("No artifacts named github-pages were found").
      # A re-run of the whole job would give the merge a second version number, so the deploy itself is tried again here.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before trying the deploy again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait longer before the last try
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 90
      - if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
