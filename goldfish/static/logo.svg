<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="ICEYFISH logo: a fish frozen in an ice cube">
  <defs>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f9ff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#9fdcff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4aa6e0" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#cdeeff"/>
      <stop offset="1" stop-color="#7cc3ee"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe8ff"/>
      <stop offset="1" stop-color="#5fb4e8"/>
    </linearGradient>
    <clipPath id="clipcube"><rect x="8" y="12" width="112" height="92" rx="22"/></clipPath>
  </defs>
  <!-- icicles -->
  <path d="M24 98 L31 124 L40 98Z M52 100 L58 117 L66 100Z M78 99 L86 126 L96 99Z" fill="#d9f2ff" stroke="#8fd0f7" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- cube -->
  <rect x="8" y="12" width="112" height="92" rx="22" fill="url(#cube)" stroke="#d6f1ff" stroke-width="4"/>
  <g clip-path="url(#clipcube)">
    <g transform="translate(4 6) scale(.92)">
    <path d="M88 62 C100 46 110 40 117 34 C112 50 112 74 117 90 C110 84 100 78 88 62Z" fill="url(#fin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M38 44 C46 28 64 28 72 44 C60 41 50 41 38 44Z" fill="url(#fin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M44 78 C50 90 62 90 66 78 C58 80 52 80 44 78Z" fill="url(#fin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M14 62 C26 36 64 28 88 62 C64 96 26 88 14 62Z" fill="url(#body)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50 50 q7 5 0 13 M61 48 q7 6 0 17 M72 52 q6 5 0 11" fill="none" stroke="#9fd6f6" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M34 66 q6 5 14 3" fill="none" stroke="#7cc3ee" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="30" cy="57" r="5.5" fill="#0a2a40"/><circle cx="28.3" cy="55.3" r="2" fill="#fff"/>
    </g>
    <!-- frost cracks and glints on the ice -->
    <path d="M96 20 l8 10 l-3 9 M104 30 l9 2 M20 92 l9-6 l2 8 M29 86 l-8-2" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 22 Q40 14 70 18" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 36 L14 46" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <path d="M112 8 l2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2-5.8 -5.8-2.2 5.8-2.2Z" fill="#fff"/>
  <path d="M10 6 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4-3.6 -3.6-1.4 3.6-1.4Z" fill="#d6f1ff"/>
</svg>
